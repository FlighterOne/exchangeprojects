<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Cod TEST</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 24px;
            margin: 0;
        }
        .ok { color: #34c759; }
        .bad { color: #ff3b30; }
        .box {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 14px;
            margin: 12px 0;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.45;
        }
        button {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2ea6ff;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        button.secondary { background: #333; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        .muted { color: #8a8a8a; font-size: 13px; }
    </style>
</head>
<body>
    <h1>X-Cod TEST <span class="ok">v-test-1</span></h1>
    <p class="muted">Если ты видишь этот текст — HTML работает. Дальше жми кнопки.</p>

    <div class="box" id="info">Скрипт ещё не выполнился…</div>

    <button onclick="runLocal()">1. Проверка JS (без сети)</button>
    <button onclick="runHealth()">2. Проверка API /health</button>
    <button onclick="runUser()">3. Проверка API /user</button>
    <button class="secondary" onclick="location.reload()">Обновить</button>

    <div class="box" id="log">Лог пуст</div>

    <script>
    // Никакого telegram.org — специально, чтобы исключить CDN
    var API = "https://exchange-stavka.waw0.amvera.tech";
    var logEl = document.getElementById("log");
    var infoEl = document.getElementById("info");

    function log(msg) {
        var t = new Date().toLocaleTimeString();
        logEl.innerHTML = "[" + t + "] " + msg + "<br>" + logEl.innerHTML;
    }

    // Сразу видно, что JS жив
    infoEl.innerHTML =
        '<span class="ok">JS запустился</span><br>' +
        'location: ' + location.href + '<br>' +
        'Telegram object: ' + (window.Telegram ? "есть" : "нет") + '<br>' +
        'UserAgent: ' + navigator.userAgent;

    log("Страница открыта, JS ок");

    function runLocal() {
        log('<span class="ok">Локальный тест OK — JS точно работает</span>');
        alert("JS работает");
    }

    function withTimeout(promise, ms) {
        return new Promise(function(resolve, reject) {
            var done = false;
            setTimeout(function() {
                if (done) return;
                done = true;
                reject(new Error("Таймаут " + ms + "мс"));
            }, ms);
            promise.then(function(v) {
                if (done) return;
                done = true;
                resolve(v);
            }, function(e) {
                if (done) return;
                done = true;
                reject(e);
            });
        });
    }

    function runHealth() {
        log("Запрос GET " + API + "/api/health ...");
        withTimeout(fetch(API + "/api/health"), 8000)
            .then(function(r) { return r.text().then(function(t){ return {status: r.status, text: t}; }); })
            .then(function(x) {
                log('<span class="ok">health HTTP ' + x.status + '</span>: ' + x.text);
            })
            .catch(function(e) {
                log('<span class="bad">health FAIL: ' + e.message + '</span>');
            });
    }

    function runUser() {
        var initData = "";
        try {
            if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) {
                initData = Telegram.WebApp.initData;
            }
        } catch (e) {}

        log("initData length = " + initData.length);
        var url = API + "/api/user?initData=" + encodeURIComponent(initData || "test");
        log("Запрос GET /api/user ...");

        withTimeout(fetch(url, {
            headers: initData ? { "X-Telegram-Init-Data": initData } : {}
        }), 10000)
            .then(function(r) { return r.text().then(function(t){ return {status: r.status, text: t}; }); })
            .then(function(x) {
                log('<span class="ok">user HTTP ' + x.status + '</span>: ' + x.text.slice(0, 300));
            })
            .catch(function(e) {
                log('<span class="bad">user FAIL: ' + e.message + '</span>');
            });
    }
    </script>
</body>
</html>
