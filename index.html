<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моё Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h2>Привет из Mini App!</h2>
    <p id="user"></p>

    <input type="text" id="message" placeholder="Напиши что-нибудь...">
    <button onclick="sendData()">Отправить в бота</button>
    <button onclick="Telegram.WebApp.close()">Закрыть</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // открыть на весь экран

        // Показать имя пользователя
        document.getElementById('user').innerText =
            'Привет, ' + (tg.initDataUnsafe.user?.first_name || 'гость') + '!';

        function sendData() {
            const text = document.getElementById('message').value;
            if (text) {
                tg.sendData(text); // отправляет данные боту
                tg.close();
            }
        }
    </script>
</body>
</html>
